<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Thêm dữ liệu mẫu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #667eea;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .result.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .result.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #2196F3;
        }

        .quick-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .quick-btn {
            padding: 10px;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .quick-btn:hover {
            background: #e0e0e0;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🧪 Thêm Dữ Liệu Cảm Biến Mẫu</h1>

        <div class="info">
            <strong>ℹ️ Thông tin:</strong> Tool này giúp bạn thêm dữ liệu mẫu vào database để test dashboard.
        </div>

        <div class="form-group">
            <label>📧 Email của bạn:</label>
            <input type="email" id="userEmail" placeholder="Tự động lấy từ localStorage">
        </div>

        <div class="form-group">
            <label>🌡️ Nhiệt độ (°C):</label>
            <input type="number" id="temperature" value="28.5" step="0.1">
        </div>

        <div class="form-group">
            <label>💧 Độ ẩm (%):</label>
            <input type="number" id="humidity" value="65" step="1">
        </div>

        <div class="form-group">
            <label>🌧️ Mưa:</label>
            <select id="rain">
                <option value="false">Không mưa</option>
                <option value="true">Có mưa</option>
            </select>
        </div>

        <button onclick="addSingleData()">➕ Thêm 1 Mẫu Dữ Liệu</button>

        <div class="quick-actions">
            <button class="quick-btn" onclick="addMultipleData(5)">➕ Thêm 5 mẫu</button>
            <button class="quick-btn" onclick="addMultipleData(10)">➕ Thêm 10 mẫu</button>
            <button class="quick-btn" onclick="addRandomData()">🎲 Thêm ngẫu nhiên</button>
            <button class="quick-btn" onclick="clearAndAdd()">🗑️ Xóa & thêm mới</button>
        </div>

        <div id="result" class="result"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080/api';

        // Auto-fill email from localStorage
        window.addEventListener('DOMContentLoaded', () => {
            const userStr = localStorage.getItem('user');
            if (userStr) {
                const user = JSON.parse(userStr);
                document.getElementById('userEmail').value = user.email;
            }
        });

        async function addSingleData() {
            const email = document.getElementById('userEmail').value;
            const temperature = parseFloat(document.getElementById('temperature').value);
            const humidity = parseFloat(document.getElementById('humidity').value);
            const rain = document.getElementById('rain').value === 'true';

            if (!email) {
                showResult('Vui lòng nhập email!', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/in4-arduino`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        userEmail: email,
                        temperature: temperature,
                        humidity: humidity,
                        rain: rain,
                        timestamp: new Date().toISOString()
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    showResult(`✅ Đã thêm thành công! ID: ${data._id}`, 'success');
                } else {
                    const error = await response.text();
                    showResult(`❌ Lỗi: ${error}`, 'error');
                }
            } catch (error) {
                showResult(`❌ Lỗi kết nối: ${error.message}`, 'error');
            }
        }

        async function addMultipleData(count) {
            const email = document.getElementById('userEmail').value;
            if (!email) {
                showResult('Vui lòng nhập email!', 'error');
                return;
            }

            let success = 0;
            let failed = 0;

            for (let i = 0; i < count; i++) {
                const temp = 20 + Math.random() * 15; // 20-35°C
                const hum = 50 + Math.random() * 40;  // 50-90%
                const rain = Math.random() > 0.8;     // 20% chance of rain

                // Subtract i minutes from current time
                const timestamp = new Date(Date.now() - i * 5 * 60000);

                try {
                    const response = await fetch(`${API_URL}/in4-arduino`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            userEmail: email,
                            temperature: parseFloat(temp.toFixed(1)),
                            humidity: parseFloat(hum.toFixed(1)),
                            rain: rain,
                            timestamp: timestamp.toISOString()
                        })
                    });

                    if (response.ok) {
                        success++;
                    } else {
                        failed++;
                    }
                } catch (error) {
                    failed++;
                }

                // Small delay to avoid overwhelming the server
                await new Promise(resolve => setTimeout(resolve, 100));
            }

            showResult(`✅ Đã thêm ${success} mẫu thành công, ${failed} thất bại`, 'success');
        }

        async function addRandomData() {
            const email = document.getElementById('userEmail').value;
            if (!email) {
                showResult('Vui lòng nhập email!', 'error');
                return;
            }

            // Random between 1-20 samples
            const count = Math.floor(Math.random() * 20) + 1;
            await addMultipleData(count);
        }

        async function clearAndAdd() {
            if (!confirm('Bạn có chắc muốn XÓA TẤT CẢ dữ liệu cũ và thêm mới?')) {
                return;
            }

            showResult('Chức năng này chưa được thực hiện (cần API delete all)', 'error');
            // TODO: Implement delete all API
            // await addMultipleData(10);
        }

        function showResult(message, type) {
            const result = document.getElementById('result');
            result.textContent = message;
            result.className = `result ${type}`;
            result.style.display = 'block';

            setTimeout(() => {
                result.style.display = 'none';
            }, 5000);
        }
    </script>
</body>

</html>
